spring.application.name=docbot
# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:postgresql://postgres:5432/documind
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

# ===============================
# SPRING AI - OLLAMA
# ===============================
spring.ai.ollama.base-url=http://ollama:11434

spring.ai.ollama.chat.options.model=qwen2.5:1.5b
spring.ai.ollama.embedding.options.model=nomic-embed-text


# ===============================
# VECTOR STORE (PGVECTOR)
# ===============================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.dimensions=768

# ===============================
# DOCUMIND RAG TUNING
# ===============================
app.rag.retrieval.top-k=3
app.rag.retrieval.similarity-threshold=0.40
app.rag.retrieval.max-chunk-context-chars=900
app.rag.retrieval.max-total-context-chars=2800

app.rag.ingestion.chunk-size=1500
app.rag.ingestion.chunk-overlap=200

app.rag.metrics.rolling-window=20

# ===============================
# AUTH
# ===============================
app.auth.jwt-secret=documind-ai-jwt-secret-key-for-local-development-only-123456789
app.auth.jwt-expiration-seconds=86400

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# SERVER
# ===============================
server.port=8080
