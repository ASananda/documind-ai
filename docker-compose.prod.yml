services:
  app:
    build:
      context: .
    image: ${APP_IMAGE:-documind-app:latest}
    container_name: documind-app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET}
      APP_AUTH_JWT_EXPIRATION_SECONDS: ${APP_AUTH_JWT_EXPIRATION_SECONDS:-86400}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres
      - ollama
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - documind

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: ${FRONTEND_IMAGE:-documind-frontend:latest}
    container_name: documind-frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - documind

  postgres:
    image: pgvector/pgvector:pg17
    container_name: documind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - documind

  ollama:
    image: ollama/ollama:latest
    container_name: documind-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - documind

volumes:
  postgres_data:
  ollama_data:

networks:
  documind:
